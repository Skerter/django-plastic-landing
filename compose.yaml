services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: demoplast
      POSTGRES_USER: demoplast
      POSTGRES_PASSWORD: demoplast
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    # The demo in one command. migrate + collectstatic run in entrypoint.sh before
    # this command; what is left here needs a ready database and matters for the demo:
    #   tailwind build   — dist is in .gitignore and the host bind wipes it → rebuild
    #   seed_demo_images — placeholder product images (a working carousel)
    #   seed_demo_leads  — fake leads, so the admin is not empty
    # (categories/products/contacts are already seeded by migrations during migrate)
    command: >
      sh -c "python manage.py tailwind build &&
             python manage.py seed_demo_images &&
             python manage.py seed_demo_leads &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - /app/.venv
      - media_data:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

volumes:
  postgres_data:
  media_data:
