server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options nosniff;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # only /media/ is served — the product placeholders (generated by seed_demo_images)
    location /media/ {
        alias /srv/media/;
        expires 7d;
        access_log off;
    }

    # nothing else is served from this container
    location / {
        return 404;
    }
}
